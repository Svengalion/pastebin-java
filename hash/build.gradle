plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.svengali'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

bootJar {
    mainClass = 'com.svengali.Application'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'

    implementation 'org.modelmapper:modelmapper:3.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.hibernate:hibernate-jpamodelgen:6.4.4.Final'

    implementation project(':common')
    testImplementation project(':common')
    // Тестовые зависимости
    implementation 'org.testcontainers:testcontainers:1.18.3'
    implementation 'org.testcontainers:postgresql:1.18.3'
    implementation 'io.github.cdimascio:dotenv-java:2.2.4'
    implementation 'org.mockito:mockito-core:5.3.1'
    implementation 'org.springframework.boot:spring-boot-starter-test'

    // Удаляем явные зависимости JUnit, так как они включены в spring-boot-starter-test
}

test {
    useJUnitPlatform()
}
